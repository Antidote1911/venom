[workspace]
members = ["vnmcore", "vnmcore-ffi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Venom Project"]
license = "MIT"

[workspace.dependencies]
# Crypto
aes-gcm           = "0.11.0-rc.4"
chacha20poly1305  = "0.11.0-rc.3"
deoxys            = "0.2.0-rc.3"
serpent           = "0.6.0"
ctr               = "0.10.1"
hybrid-array      = "0.4"
cipher            = "0.5"
argon2 = "0.5"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1.7", features = ["derive"] }
subtle = "2.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
ml-kem        = { version = "0.3", features = ["getrandom"] }
x25519-dalek  = { version = "2", features = ["static_secrets", "getrandom"] }

# Utilities
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"

# Async
tokio = { version = "1", features = ["full"] }

# FUSE (Linux/macOS)
fuser = "0.14"

# Bytes serialization
serde_bytes = "0.11"
